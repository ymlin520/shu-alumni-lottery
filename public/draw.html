<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸運抽獎</title>
<link rel="icon" href="/brand/favicon">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  [hidden] { display: none !important; }
  body { overflow-x: hidden; }
  .topbar { padding-top: 12px; padding-bottom: 6px; }
  .login { max-width: 400px; margin: 12vh auto 0; padding: 32px 28px; }
  .login h1 { margin: 0 0 20px; font-size: 22px; letter-spacing: .1em; }
  .top-actions { display: flex; gap: 10px; align-items: center; }

  /* ===== 抽獎舞台（整頁） ===== */
  .stage { min-height: calc(100vh - 90px); padding: 0 16px 12px; text-align: center; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  .stage:fullscreen { min-height: 100vh; justify-content: center; background: var(--bg-deco, url(/brand/bg)) center / cover no-repeat, radial-gradient(900px 560px at 50% 40%, var(--glow1) 0%, transparent 70%), linear-gradient(180deg, var(--bg), var(--bg2)); }
  .stage h2 { margin: 18px 0 4px; font-size: var(--draw-title-size); letter-spacing: .16em; font-family: var(--font-display); color: var(--gold-hi); }
  .hub-logo { width: var(--hub-logo-size, 74%); height: auto; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .hub-text:empty { display: none; }
  .hub-text { position: absolute; bottom: 12%; left: 0; right: 0; font-size: calc(var(--size) * .022); }
  .stage .left { margin: 0 0 14px; color: var(--text); font-size: 18px; }
  .stage .left b { color: var(--gold-hi); font-size: 22px; }
  .prize-chip { display: inline-block; margin: 0 0 10px; padding: 4px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(216,172,90,.12); color: var(--gold-hi); font-weight: 700; letter-spacing: .1em; }
  .machine { --size: var(--machine-size); width: var(--size); margin: 0 auto; position: relative; }
  .ring {
    width: var(--size); height: var(--size); border-radius: 50%; position: relative; padding: 4.2%;
    background: conic-gradient(from 200deg, var(--ring-a), var(--ring-b) 18%, var(--ring-c) 35%, color-mix(in srgb, var(--ring-a) 50%, var(--ring-b)) 52%, color-mix(in srgb, var(--ring-b) 70%, var(--ring-c)) 70%, var(--ring-a) 88%, var(--ring-b));
    box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 30px 60px rgba(0,0,0,.45), 0 0 80px rgba(216,172,90,.18);
  }
  .drum {
    width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, var(--drum-a) 0%, color-mix(in srgb, var(--drum-a) 50%, var(--drum-b)) 55%, var(--drum-b) 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.06);
  }
  .drum::before { /* 玻璃反光 */
    content: ""; position: absolute; inset: 6% 12% 55% 12%; border-radius: 50%; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.14), transparent 70%);
  }
  .drum::after { /* 內圈 */
    content: ""; position: absolute; inset: 5%; border-radius: 50%; border: 1px solid rgba(255,255,255,.07); pointer-events: none;
  }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 27%; height: 27%; transform: translate(-50%, -50%); border-radius: 50%; z-index: 4;
    display: grid; place-items: center; text-align: center; color: var(--gold-hi); font-weight: 800; letter-spacing: .18em;
    font-size: calc(var(--size) * .032); line-height: 1.5;
    background: radial-gradient(circle at 40% 35%, var(--drum-a), var(--bg) 70%);
    border: calc(var(--size) * .012) solid var(--gold); box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
  }
  .drum .ball { z-index: 2; will-change: transform; }
  .drum .ball.picked { transition: transform .45s cubic-bezier(.5,0,.8,.4), opacity .25s .35s; z-index: 6; }
  .spinning .hub { animation: hubspin 1.2s linear infinite; }
  @keyframes hubspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .tray {
    position: relative; width: 60%; height: calc(var(--size) * .12); margin: calc(var(--size) * -.1) auto 0; z-index: 8;
    border-radius: 0 0 18px 18px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--ring-a) 50%, var(--ring-b)), var(--ring-b) 60%, var(--ring-c));
    box-shadow: 0 10px 20px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.5);
  }
  .tray-ball {
    position: absolute; left: 50%; bottom: 20%; width: calc(var(--size) * .3); height: calc(var(--size) * .3);
    transform: translateX(-50%) scale(0); border-radius: 50%; display: grid; place-items: center; z-index: 9;
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--tray-ball) 25%, white), var(--tray-ball) 45%, color-mix(in srgb, var(--tray-ball) 65%, black) 100%);
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.25), 0 12px 24px rgba(0,0,0,.4), 0 0 0 4px rgba(255,255,255,.15);
  }
  .tray-ball span { color: var(--btn-text); font-weight: 900; font-family: var(--font-display); padding: 0 10%; line-height: 1.15; word-break: break-all; position: relative; z-index: 1; }
  .tray-ball.show { transform: translateX(-50%) scale(1); animation: trayDrop .8s cubic-bezier(.3,1.5,.5,1); }
  @keyframes trayDrop { 0% { transform: translateX(-50%) translateY(-120%) scale(.5); } 100% { transform: translateX(-50%) translateY(0) scale(1); } }
  .draw-btn { margin: 20px auto 0; width: min(320px, 80%); display: block; font-size: 22px; }
  .result { margin-top: 8px; min-height: 120px; }
  .result .lbl { color: var(--text); font-size: 20px; letter-spacing: .1em; }
  .result .prize { display: inline-block; margin-left: 8px; padding: 2px 12px; border-radius: 999px; background: rgba(216,172,90,.15); color: var(--gold-hi); font-size: 16px; }
  .result .nm { font-size: var(--winner-size); font-weight: 900; letter-spacing: .14em; font-family: var(--font-display); color: var(--gold-hi); text-shadow: 0 0 24px rgba(216,172,90,.4); margin-top: 4px; }
  .result .meta { color: var(--muted); font-size: 16px; }
  .result.pop .nm { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.6); } }
  .confetti { position: absolute; top: -12px; width: 9px; height: 14px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }
  @media (max-width: 760px) { #fsBtn { display: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="/brand/logo" data-asset="logo" alt="Logo"><span data-t="draw.brand">世新大學 70 週年</span></div>
  <div class="top-actions" id="actions" hidden>
    <button class="btn-ghost" id="fsBtn" title="投影用全螢幕">⛶ 全螢幕</button>
    <a class="pill" href="/admin" target="_blank">後台管理</a>
  </div>
</header>

<!-- 登入 -->
<section class="card login" id="loginCard" hidden>
  <h1>抽獎畫面登入</h1>
  <div id="loginErr" class="msg err" hidden></div>
  <form id="loginForm">
    <div class="field"><label for="pw">管理密碼</label><input class="input" type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn-gold" style="width:100%;font-size:18px">登入</button>
  </form>
</section>

<main class="stage" id="stage" hidden>
  <h2 data-t="draw.heading">今天的幸運校友是誰？</h2>
  <p class="left"><span data-t="draw.leftPre">還有</span> <b id="remain">0</b> <span data-t="draw.leftPost">位校友待抽</span></p>
  <div class="machine">
    <div class="ring">
      <div class="drum" id="drum"><div class="hub"><img class="hub-logo" src="/brand/hub" data-asset="hub" alt=""><span class="hub-text" data-t="draw.hub"></span></div></div>
    </div>
    <div class="tray"><div class="tray-ball" id="trayBall"><span id="trayName"></span></div></div>
  </div>
  <button class="btn-gold draw-btn" id="drawBtn">開始抽獎</button>
  <span hidden data-t="draw.button">開始抽獎</span><span hidden data-t="draw.drawing">抽獎中…</span><span hidden data-t="draw.allDone">全部抽完了</span><span hidden data-t="draw.congrats">恭喜抽中</span><span hidden data-t="draw.former">原名</span>
  <div class="result" id="result"></div>
</main>

<script src="/assets/design.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let info = null; // { settings, remaining }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/admin/login') { showLogin(); throw new Error('未登入'); }
  if (!r.ok) throw new Error(d.error || '操作失敗');
  return d;
}
function showLogin() { $('#loginCard').hidden = false; $('#stage').hidden = true; $('#actions').hidden = true; }
function maskName(n) {
  if (!info?.settings.maskName || !/[一-鿿]/.test(n)) return n;
  const a = [...n];
  if (a.length <= 1) return n;
  if (a.length === 2) return a[0] + '○';
  return a[0] + '○'.repeat(a.length - 2) + a[a.length - 1];
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/admin/login', { method: 'POST', body: { password: $('#pw').value } }); $('#loginCard').hidden = true; load(); }
  catch (err) { const b = $('#loginErr'); b.textContent = err.message; b.hidden = false; }
});
$('#fsBtn').addEventListener('click', () => { document.fullscreenElement ? document.exitFullscreen() : $('#stage').requestFullscreen?.(); });

async function load() {
  if (DESIGN_PREVIEW) info = { settings: { prize: '頭獎', maskName: false }, remaining: 30 };
  else try { info = await api('/api/admin/draw-info'); } catch { return; }
  $('#stage').hidden = false; $('#actions').hidden = false;
  render();
}
function render() {
  $('#remain').textContent = info.remaining;
  if (!drawing) {
    buildBalls(info.remaining);
    $('#drawBtn').disabled = info.remaining === 0;
    $('#drawBtn').textContent = T(info.remaining === 0 ? 'draw.allDone' : 'draw.button');
  }
}
// 後台改了獎項／遮蔽設定、或有新登記時自動同步
document.addEventListener('designchange', () => { if (info && !drawing) render(); });
setInterval(() => { if (!DESIGN_PREVIEW && !drawing && !$('#stage').hidden) api('/api/admin/draw-info').then((d) => { info = d; render(); }).catch(() => {}); }, 4000);

// ---------- 彩球物理 ----------
const COLORS = ['c-gold', 'c-teal', 'c-pink', 'c-green', 'c-purple'];
const drum = $('#drum');
let balls = [], mixing = false, drawing = false;
function dims() { const D = drum.clientWidth; return { D, R: D / 2, r: D * 0.068, hub: D * 0.135 + D * 0.012 }; }
function buildBalls(n) {
  n = Math.min(n, 26);
  if (balls.length === n) return;
  balls.forEach((b) => b.el.remove());
  const { D, R, r } = dims();
  balls = Array.from({ length: n }, (_, i) => {
    const el = document.createElement('div');
    el.className = 'ball ' + COLORS[i % COLORS.length];
    el.style.width = el.style.height = r * 2 + 'px';
    drum.appendChild(el);
    const a = Math.random() * Math.PI * 2, d = R * (0.45 + Math.random() * 0.4);
    return { el, x: R + Math.cos(a) * d, y: R + Math.sin(a) * d, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4, picked: false };
  });
}
function step() {
  const { D, R, r, hub } = dims();
  const live = balls.filter((b) => !b.picked);
  const g = D * 0.0011, limit = R * 0.93 - r, e = mixing ? 0.9 : 0.45;
  for (const b of live) {
    b.vy += g;
    if (mixing) {
      // 底部往上吹的氣流＋繞圈旋轉＋亂流
      const dx = b.x - R, dy = b.y - R, dist = Math.hypot(dx, dy) || 1;
      b.vx += (Math.random() - .5) * D * 0.014 + (-dy / dist) * D * 0.0022;
      b.vy += (Math.random() - .5) * D * 0.014 + (dx / dist) * D * 0.0022 - (dy > 0 ? D * (0.004 + Math.random() * 0.006) : 0);
    }
    const sp = Math.hypot(b.vx, b.vy), max = D * (mixing ? 0.045 : 0.02);
    if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
    b.vx *= 0.995; b.vy *= 0.995;
    b.x += b.vx; b.y += b.vy;
    // 外圈
    let dx = b.x - R, dy = b.y - R, d = Math.hypot(dx, dy) || 1;
    if (d > limit) {
      const nx = dx / d, ny = dy / d; b.x = R + nx * limit; b.y = R + ny * limit;
      const vn = b.vx * nx + b.vy * ny; if (vn > 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
      if (!mixing) { b.vx *= 0.96; }
    }
    // 中心軸
    dx = b.x - R; dy = b.y - R; d = Math.hypot(dx, dy) || 1;
    if (d < hub + r) {
      const nx = dx / d, ny = dy / d; b.x = R + nx * (hub + r); b.y = R + ny * (hub + r);
      const vn = b.vx * nx + b.vy * ny; if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
    }
  }
  // 球與球
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 2 * r) {
      const nx = dx / d, ny = dy / d, o = (2 * r - d) / 2;
      a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { const k = -(1 + e) * rv / 2; a.vx -= k * nx; a.vy -= k * ny; b.vx += k * nx; b.vy += k * ny; }
    }
  }
  for (const b of live) b.el.style.transform = `translate(${b.x - r}px, ${b.y - r}px)`;
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
window.addEventListener('resize', () => { const { r } = dims(); balls.forEach((b) => b.el.style.width = b.el.style.height = r * 2 + 'px'); });
document.addEventListener('fullscreenchange', () => setTimeout(() => { const { r } = dims(); balls.forEach((b) => b.el.style.width = b.el.style.height = r * 2 + 'px'); }, 50));

const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
function confetti() {
  const cols = ['#f7e3b0', '#d8ac5a', '#fff4d2', '#e0303a', '#ff6b6b', '#c9793f', '#ffffff'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = 2.2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .5 + 's';
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    $('#stage').appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

$('#drawBtn').addEventListener('click', async () => {
  if (drawing) return;
  drawing = true;
  const btn = $('#drawBtn'); btn.disabled = true; btn.textContent = T('draw.drawing');
  $('#trayBall').classList.remove('show'); $('#result').innerHTML = ''; $('#result').classList.remove('pop');
  // 攪拌與抽籤同時開始，按下後 5 秒內出現姓名；獎項以後台設定為準
  mixing = true; drum.classList.add('spinning');
  let res;
  try {
    const req = DESIGN_PREVIEW
      ? Promise.resolve({ winner: { name: '王小明', formerName: '', prize: info.settings.prize }, remaining: Math.max(info.remaining - 1, 0) })
      : api('/api/admin/draw', { method: 'POST', body: {} });
    [res] = await Promise.all([req, sleep(3800)]);
  } catch (err) { mixing = false; drum.classList.remove('spinning'); alert(err.message); drawing = false; render(); return; }
  mixing = false; drum.classList.remove('spinning');
  await sleep(200);
  // 最靠近出口的球掉出去
  const { D, R, r } = dims();
  const live = balls.filter((b) => !b.picked);
  const pick = live.sort((a, b) => Math.hypot(a.x - R, a.y - D) - Math.hypot(b.x - R, b.y - D))[0];
  if (pick) {
    pick.picked = true; pick.el.classList.add('picked');
    requestAnimationFrame(() => { pick.el.style.transform = `translate(${R - r}px, ${D + r}px)`; pick.el.style.opacity = '0'; });
    await sleep(500);
  }
  // 出獎
  const w = res.winner, shown = maskName(w.name);
  const nameEl = $('#trayName');
  nameEl.textContent = shown;
  nameEl.style.fontSize = `calc(var(--size) * ${[...shown].length <= 3 ? .062 : [...shown].length <= 5 ? .048 : .034})`;
  $('#trayBall').classList.add('show');
  await sleep(300);
  $('#result').innerHTML = `<div class="lbl">${esc(T('draw.congrats'))}</div>
    <div class="nm">${esc(shown)}</div>
    ${w.formerName && !info.settings.maskName ? `<div class="meta">（${esc(T('draw.former'))} ${esc(w.formerName)}）</div>` : ''}`;
  $('#result').classList.add('pop');
  confetti();
  info.remaining = res.remaining;
  if (pick) { pick.el.remove(); balls = balls.filter((b) => b !== pick); }
  drawing = false;
  render();
});

load();
</script>
</body>
</html>
