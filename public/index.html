<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世新校友抽獎登記</title>
<link rel="icon" href="/brand/favicon">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  [hidden] { display: none !important; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 60px; }
  .hero { position: relative; text-align: center; padding: 28px 0 30px; }
  .hero h1 { font-size: var(--reg-title-size); margin: 0 0 12px; letter-spacing: .14em; font-family: var(--font-display); }
  .hero h1 span { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--text); font-size: 16px; line-height: 1.7; text-shadow: 0 1px 8px rgba(60,0,4,.9), 0 0 2px rgba(60,0,4,.8); }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .form { padding: 30px 28px; }
  .form h2 { margin: 0 0 6px; font-size: 22px; font-family: var(--font-display); letter-spacing: .1em; color: var(--gold-hi); }
  .form .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .former { display: none; margin-top: 12px; }
  .former.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } }
  .submit { width: 100%; margin-top: 8px; }
  .privacy { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin-top: 18px; text-align: center; }
  .done { padding: 44px 28px; text-align: center; }
  .done .big-ball { position: relative; width: 120px; height: 120px; margin: 0 auto 22px; display: grid; place-items: center; animation: drop .7s cubic-bezier(.3,1.6,.5,1); }
  .done .big-ball span { position: relative; z-index: 1; font-weight: 900; color: var(--btn-text); font-size: 22px; }
  @keyframes drop { from { transform: translateY(-80px) scale(.6); opacity: 0; } }
  .done h2 { margin: 0 0 10px; font-size: 28px; letter-spacing: .12em; font-family: var(--font-display); color: var(--gold-hi); }
  .done p { color: var(--muted); line-height: 1.8; margin: 0; }
  .done h2 { margin-bottom: 0; }
  .closed { padding: 44px 28px; text-align: center; }
  .closed h2 { margin: 0 0 10px; }
  .closed p { color: var(--muted); margin: 0; }
  @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; gap: 0; } .form { padding: 24px 18px; } }
</style>
</head>
<body>
<div class="watermark" aria-hidden="true" data-t="reg.watermark">ALUMNI</div>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="/brand/logo" data-asset="logo" alt="Logo"><span data-t="reg.brand">世新大學 70 週年</span></div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="id-badge" data-t="reg.badge">校友場　ALUMNI</div>
    <h1><span data-t="reg.title">世新大學校友抽獎活動</span></h1>
    <p data-t="reg.intro">填寫校友資料完成登記，即可參加現場抽獎。
每人限登記一次，祝您好運！</p>
  </section>

  <section class="card form" id="formCard">
    <h2 data-t="reg.formTitle">校友登記</h2>
    <p class="sub" data-t="reg.formSub">標示 * 為必填</p>
    <div id="err" class="msg err" hidden></div>
    <form id="f" novalidate>
      <div class="field">
        <label for="idNo"><span id="idLabel" data-t="reg.twid">身分證字號</span><span class="req">*</span></label>
        <input class="input" id="idNo" name="idNo" autocomplete="off" maxlength="20" data-tp="reg.twidPh" placeholder="例：A123456789" style="text-transform:uppercase">
        <span class="hint" data-t="reg.idHint">僅作為身分核對使用，不會公開顯示。</span>
      </div>
      <div class="field">
        <label for="name"><span data-t="reg.name">姓名</span><span class="req">*</span></label>
        <input class="input" id="name" name="name" autocomplete="name" maxlength="40" data-tp="reg.namePh" placeholder="請填寫姓名">
      </div>
      <button class="btn-gold submit" id="submit" type="submit" data-t="reg.submit">送出登記</button>
      <p class="privacy" data-t="reg.privacy">您提供的個人資料僅用於本次校友抽獎活動之身分核對與得獎聯繫，活動結束後依規定銷毀。</p>
    </form>
  </section>

  <section class="card done" id="done" hidden>
    <div class="big-ball ball c-gold"><span>✓</span></div>
    <h2 id="doneTitle" data-t="reg.doneTitle">已完成登記</h2>
  </section>

  <section class="card closed" id="closed" hidden>
    <h2 data-t="reg.closedTitle">登記已截止</h2>
    <p data-t="reg.closedText">本次活動已停止登記，感謝您的關注。</p>
  </section>
</main>

<script src="/assets/design.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let doneAlready = false; // true = 這位校友先前已登記過
let doneData = { name: '王小明', no: 'A0001' };

function showView(v) {
  $('#formCard').hidden = v !== 'form';
  $('#done').hidden = v !== 'done';
  $('#closed').hidden = v !== 'closed';
}
function renderDynamic() {
  document.title = T('reg.title');
  $('#idLabel').textContent = T('reg.twid');
  $('#idNo').placeholder = T('reg.twidPh');
  $('#doneTitle').textContent = T(doneAlready ? 'reg.alreadyTitle' : 'reg.doneTitle');
}
renderDynamic();
document.addEventListener('designchange', renderDynamic);
document.addEventListener('previewview', (e) => showView(e.detail));

if (!DESIGN_PREVIEW) {
  fetch('/api/status').then(r => r.json()).then(s => { if (!s.open) showView('closed'); }).catch(() => {});
}

function showErr(text, field) {
  const box = $('#err');
  box.textContent = text; box.hidden = false;
  document.querySelectorAll('.input').forEach(i => i.classList.remove('bad'));
  if (field) { const el = $('#' + field); el.classList.add('bad'); el.focus(); }
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
document.querySelectorAll('.input').forEach(i => i.addEventListener('input', () => i.classList.remove('bad')));


$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#err').hidden = true;
  const body = {
    idNo: $('#idNo').value.trim().toUpperCase(),
    name: $('#name').value.trim(),
  };
  if (DESIGN_PREVIEW) { doneData = { name: body.name || '王小明', no: 'A0001' }; renderDynamic(); return showView('done'); } // 預覽不送出
  if (!body.idNo) return showErr('請填寫' + T('reg.twid') + '。', 'idNo');
  if (!body.name) return showErr('請填寫' + T('reg.name') + '。', 'name');
  const btn = $('#submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || '送出失敗，請稍後再試。', d.field);
    doneAlready = !!d.already;
    doneData = { name: d.name, no: d.no, dept: d.dept || '' };
    renderDynamic();
    showView('done');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch { showErr('網路連線異常，請稍後再試。'); }
  finally { btn.disabled = false; btn.textContent = T('reg.submit'); }
});
</script>
</body>
</html>
